[project]
name = "rag-engine"
version = "0.1.0"
description = "Multi-tenant RAG policy Q&A platform (provider abstraction layer)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.0",
    "notion-client>=2.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["app*"]
