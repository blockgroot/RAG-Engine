[project]
name = "rag-engine"
version = "0.1.0"
description = "Multi-tenant RAG policy Q&A platform (provider abstraction layer)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.0",
    "notion-client>=2.2.1",
    "ddgs>=6.0.0",
    "rank-bm25>=0.2.2",
    "symspellpy>=6.7,<7",
    # Phase 10+: auth/crypto + HTTP API (must stay in sync with requirements.txt —
    # CI installs via `pip install -e ".[dev]"`, not requirements.txt).
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Golden-set RAGAS scoring (Phase 7) — the expensive, LLM-judged eval tier. Kept
# out of the core deps so the runtime stays minimal (CLAUDE.md §1); only the
# scheduled/manual eval needs it. langchain is pinned to the 0.3 line because
# ragas 0.2.x is incompatible with langchain 1.x (imports removed modules).
eval = [
    "ragas>=0.2,<0.3",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
]

[tool.pytest.ini_options]
markers = [
    "network: test needs outbound network (e.g. DuckDuckGo web search); deselect in CI fast tier with -m 'not network'",
]

[tool.setuptools.packages.find]
include = ["app*"]
