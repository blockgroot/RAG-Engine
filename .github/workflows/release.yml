# Release — builds the two images every install runs (self-hosted, dedicated)
# and pushes them to GitHub Container Registry when a version is tagged:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# -> ghcr.io/<owner>/handbook-api:1.0.0  (backend; the same image runs the worker)
# -> ghcr.io/<owner>/handbook-web:1.0.0  (Next.js, /api proxied to http://api:8000)
#
# Both for amd64 and arm64, so a customer's ARM server works too. A new GHCR
# package starts private: check its visibility under the repo's Packages after
# the first release, and grant customers read access there.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: handbook-api
            context: .
          - name: handbook-web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
