# Render Blueprint — one-click backend deploy. Push repo, then in Render:
# "New +" -> "Blueprint" -> point at this repo.
#
# DATABASE_URL: external Postgres (Supabase/Neon), not Render-managed — avoids
# Render's card prompt on DB provisioning. Use Supabase's Session pooler
# string (port 5432, *.pooler.supabase.com), not the direct/Transaction one —
# direct is IPv6-only on free tier; Transaction mode breaks per-connection
# register_vector setup in app/db/connection.py.
#
# Every other secret is `sync: false` (Render prompts in dashboard, never
# stored in repo). Fill in once from local `.env` (never commit `.env`).
#
# Plan `free`: cold-starts after ~15 min idle. Bump to `starter` for always-on.
#
# Region must match DATABASE_URL's region (ap-south-1 Mumbai -> singapore,
# us-east-1 -> virginia, us-west-* -> oregon, eu-* -> frankfurt) — cross-region
# adds ~250ms/query, multiplied by the chatty API's query count. Render can't
# change an existing service's region in place; redeploy a new service and
# repoint Vercel's API_PROXY_TARGET.
region: singapore

# PR previews: one throwaway instance per open PR, auto torn down on
# merge/close, URL commented on the PR by Render itself (no Action needed).
# ponytail: also needs a one-time manual toggle in Render dashboard (Blueprint
# -> Settings -> Enable Preview Environments) before this takes effect.
# ponytail: every preview shares the SAME external DATABASE_URL as prod (no
# per-preview DB since it's not Render-managed) — reads/writes real org data.
# Fine for now; override DATABASE_URL per-preview with a second free
# Supabase/Neon project if that becomes a real problem.
previews:
  generation: automatic

services:
  - type: web
    name: rag-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false

      # -- LLM --
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_TIMEOUT
        value: "45"

      # -- Multi-Model Selection (optional; unset = picker hidden, LLM_* only)
      # OpenRouter is a SECOND endpoint used only when a member picks a model.
      # Free tier is 50 req/day account-wide, which is why Auto stays on LLM_*.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_TIMEOUT
        value: "45"

      # Second selectable backend. Independent of OpenRouter — thousands of
      # requests/day rather than 50, and no training on inputs. Unset = its
      # models are simply not offered.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_TIMEOUT
        value: "60"

      # -- Embedding (remote — see .env.example) --
      - key: EMBEDDING_BACKEND
        value: remote
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        sync: false
      # Explicit, not the 60s default: the agent-routing probe and retrieval
      # both embed on the critical path of a question, so an unset ceiling
      # means a hanging embedder can stall a request for a minute. The probe
      # additionally caps itself (AGENT_ROUTING_PROBE_TIMEOUT, default 5s)
      # because it is a hint, not the answer.
      - key: EMBEDDING_TIMEOUT
        value: "20"
      - key: EMBEDDING_DIM
        value: "1024"
      # Batches embed() so one huge document can't build an unbounded request.
      - key: EMBED_BATCH_SIZE
        value: "16"

      # -- Reranker (remote) --
      - key: RERANKER_BACKEND
        value: remote
      - key: RERANKER_MODEL
        sync: false
      - key: RETRIEVAL_RERANK_ENABLED
        value: "true"

      # -- Auth / security (generate fresh values for prod, don't reuse dev) --
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_ENCRYPTION_KEYS
        sync: false

      # -- CORS / frontend (OAuth callbacks live on the FRONTEND origin, not here) --
      - key: API_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # -- Email (magic-link login) — free Render blocks outbound SMTP; use
      # EMAIL_SENDER=sendgrid (Single Sender Verification, no domain needed) --
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_SMTP_HOST
        sync: false
      - key: EMAIL_SMTP_PORT
        sync: false
      - key: EMAIL_SMTP_USERNAME
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: EMAIL_SMTP_FROM
        sync: false
      - key: EMAIL_RESEND_API_KEY
        sync: false
      - key: EMAIL_SENDGRID_API_KEY
        sync: false
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false

      # -- Notion (per-org token or OAuth app) --
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI
        sync: false

      # -- Google Drive OAuth (optional) --
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # -- GitHub App (optional) --
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false

      # -- Slack (optional, Phase 1: OAuth connect only) --
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false

      # -- Runtime tuning --
      - key: MODEL_WARMUP_ON_STARTUP
        value: "true"
      - key: INGEST_WORKER_IN_API
        value: "true"
      # Skip contextual enrichment past this many chunks/doc (no uncapped per-chunk LLM calls).
      - key: INGEST_CONTEXTUAL_MAX_CHUNKS
        value: "200"
      # Skip claiming new ingest jobs above this RSS ceiling — memory admission gate.
      - key: INGEST_MEMORY_GUARD_ENABLED
        value: "true"
      - key: INGEST_MAX_RSS_MB
        value: "400"
      # -- Automatic sync (freshness with nobody pressing Check) --
      # Every connection re-syncs on this interval; a webhook-flagged one goes
      # on the next tick. The interval is the FLOOR, not the plan: Drive can
      # only ever be polled (its push notifications need a Google-verified
      # domain, which *.onrender.com can never be) and a webhook delivered
      # while this free instance was cold-started is simply lost.
      - key: AUTO_SYNC_ENABLED
        value: "true"
      - key: AUTO_SYNC_INTERVAL_HOURS
        value: "6"
      # How many connections one tick may enqueue. Drop to 2 if the LLM
      # endpoint starts returning 429s during unattended syncs.
      - key: AUTO_SYNC_BATCH_SIZE
        value: "5"
      # Shared secret for POST /internal/tick, called by the repo's
      # .github/workflows/tick.yml. UNSET DISABLES THE ROUTE (404) -- a free
      # instance sleeps after ~15 min with no inbound request, so without this
      # every background loop silently stops and freshness stops with it.
      - key: INTERNAL_TICK_SECRET
        sync: false

      # -- LLM pacing --
      # The aux (ingest) provider shares the main key and endpoint, so
      # background contextualization and a member's live question compete for
      # ONE rate limit. Free Gemini is 15 rpm, and a 429 on the answer path is
      # a FAILED answer, not a slow one. reserve_rpm is the guarantee:
      # background never spends the last N requests of a minute. Interactive
      # calls are never throttled.
      - key: LLM_MAX_RPM
        value: "15"
      - key: LLM_RESERVE_RPM
        value: "5"
      # THE STRUCTURAL FIX, preferred over the reserve above: point ingest
      # contextualization at its own endpoint and the two lanes cannot contend
      # at all (the pacing gate is then skipped entirely). BOTH must be set --
      # half-configured means "not configured", because a foreign base_url with
      # the main key 401s on every contextualization and degrades SILENTLY to
      # un-prefixed chunks. Any OpenAI-compatible endpoint works.
      #
      # Note the privacy constraint is unchanged by this: contextualization
      # sends tenant chunk text, so an endpoint that trains on prompts is no
      # more acceptable here than on the answer path (see app/llm/catalog.py on
      # why nvidia/* cannot be offered via OpenRouter).
      - key: LLM_AUX_BASE_URL
        sync: false
      - key: LLM_AUX_API_KEY
        sync: false

      # Bounded LRU for per-org SymSpell dictionaries (unbounded growth otherwise).
      - key: QUERY_NORM_CACHE_MAX_ORGS
        value: "50"
      # Zero-dependency token estimator — the real BGE-M3 tokenizer OOM'd this instance
      # at ~611MB RSS. Do NOT set to "hf" on the free plan.
      - key: CHUNK_TOKEN_BACKEND
        value: heuristic
      # Absolute per-chunk character ceiling — catches whitespace-free input
      # (base64, long URLs) that word/sentence splitting can't bound.
      - key: CHUNK_MAX_CHARS
        value: "4000"
      # Cap on retrying a job that OOM-kills its own worker (breaks the crash-loop).
      - key: INGEST_MAX_JOB_ATTEMPTS
        value: "3"
      # Real client IP header for the magic-link rate limiter (socket peer is
      # Render's own router — same for every user otherwise).
      - key: CLIENT_IP_HEADER
        value: x-vercel-forwarded-for
