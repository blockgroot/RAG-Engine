# Render Blueprint — one-click backend deploy. Push repo, then in Render:
# "New +" -> "Blueprint" -> point at this repo.
#
# DATABASE_URL: external Postgres (Supabase/Neon), not Render-managed — avoids
# Render's card prompt on DB provisioning. Use Supabase's Session pooler
# string (port 5432, *.pooler.supabase.com), not the direct/Transaction one —
# direct is IPv6-only on free tier; Transaction mode breaks per-connection
# register_vector setup in app/db/connection.py.
#
# Every other secret is `sync: false` (Render prompts in dashboard, never
# stored in repo). Fill in once from local `.env` (never commit `.env`).
#
# Plan `free`: cold-starts after ~15 min idle. Bump to `starter` for always-on.
#
# Region must match DATABASE_URL's region (ap-south-1 Mumbai -> singapore,
# us-east-1 -> virginia, us-west-* -> oregon, eu-* -> frankfurt) — cross-region
# adds ~250ms/query, multiplied by the chatty API's query count. Render can't
# change an existing service's region in place; redeploy a new service and
# repoint Vercel's API_PROXY_TARGET.
region: singapore

# PR previews: one throwaway instance per open PR, auto torn down on
# merge/close, URL commented on the PR by Render itself (no Action needed).
# ponytail: also needs a one-time manual toggle in Render dashboard (Blueprint
# -> Settings -> Enable Preview Environments) before this takes effect.
# ponytail: every preview shares the SAME external DATABASE_URL as prod (no
# per-preview DB since it's not Render-managed) — reads/writes real org data.
# Fine for now; override DATABASE_URL per-preview with a second free
# Supabase/Neon project if that becomes a real problem.
previews:
  generation: automatic

services:
  - type: web
    name: rag-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false

      # -- LLM --
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_TIMEOUT
        value: "45"

      # -- Embedding (remote — see .env.example) --
      - key: EMBEDDING_BACKEND
        value: remote
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        sync: false
      - key: EMBEDDING_DIM
        value: "1024"
      # Batches embed() so one huge document can't build an unbounded request.
      - key: EMBED_BATCH_SIZE
        value: "16"

      # -- Reranker (remote) --
      - key: RERANKER_BACKEND
        value: remote
      - key: RERANKER_MODEL
        sync: false
      - key: RETRIEVAL_RERANK_ENABLED
        value: "true"

      # -- Auth / security (generate fresh values for prod, don't reuse dev) --
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_ENCRYPTION_KEYS
        sync: false

      # -- CORS / frontend (OAuth callbacks live on the FRONTEND origin, not here) --
      - key: API_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # -- Email (magic-link login) — free Render blocks outbound SMTP; use
      # EMAIL_SENDER=sendgrid (Single Sender Verification, no domain needed) --
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_SMTP_HOST
        sync: false
      - key: EMAIL_SMTP_PORT
        sync: false
      - key: EMAIL_SMTP_USERNAME
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: EMAIL_SMTP_FROM
        sync: false
      - key: EMAIL_RESEND_API_KEY
        sync: false
      - key: EMAIL_SENDGRID_API_KEY
        sync: false
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false

      # -- Notion (per-org token or OAuth app) --
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI
        sync: false

      # -- Google Drive OAuth (optional) --
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # -- GitHub App (optional) --
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false

      # -- Slack (optional, Phase 1: OAuth connect only) --
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false

      # -- Runtime tuning --
      - key: MODEL_WARMUP_ON_STARTUP
        value: "true"
      - key: INGEST_WORKER_IN_API
        value: "true"
      # Skip contextual enrichment past this many chunks/doc (no uncapped per-chunk LLM calls).
      - key: INGEST_CONTEXTUAL_MAX_CHUNKS
        value: "200"
      # Skip claiming new ingest jobs above this RSS ceiling — memory admission gate.
      - key: INGEST_MEMORY_GUARD_ENABLED
        value: "true"
      - key: INGEST_MAX_RSS_MB
        value: "400"
      # Bounded LRU for per-org SymSpell dictionaries (unbounded growth otherwise).
      - key: QUERY_NORM_CACHE_MAX_ORGS
        value: "50"
      # Zero-dependency token estimator — the real BGE-M3 tokenizer OOM'd this instance
      # at ~611MB RSS. Do NOT set to "hf" on the free plan.
      - key: CHUNK_TOKEN_BACKEND
        value: heuristic
      # Absolute per-chunk character ceiling — catches whitespace-free input
      # (base64, long URLs) that word/sentence splitting can't bound.
      - key: CHUNK_MAX_CHARS
        value: "4000"
      # Cap on retrying a job that OOM-kills its own worker (breaks the crash-loop).
      - key: INGEST_MAX_JOB_ATTEMPTS
        value: "3"
      # Real client IP header for the magic-link rate limiter (socket peer is
      # Render's own router — same for every user otherwise).
      - key: CLIENT_IP_HEADER
        value: x-vercel-forwarded-for
