<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Handbook HB logo</title>
  <desc id="desc">Rounded teal square with the letters H and B, a lime orbit, and a coral dot.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="48" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10201e"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f766e" flood-opacity=".28"/>
    </filter>
    <clipPath id="tile">
      <rect x="36" y="36" width="440" height="440" rx="116"/>
    </clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="36" y="36" width="440" height="440" rx="116" fill="url(#background)"/>
    <g clip-path="url(#tile)">
      <circle cx="452" cy="28" r="142" fill="none" stroke="#d8f36b" stroke-opacity=".38" stroke-width="10"/>
    </g>
    <text x="106" y="334" fill="#f4fff8" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="230" font-weight="800" letter-spacing="-18">H</text>
    <text x="248" y="334" fill="#d8f36b" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="230" font-weight="800" letter-spacing="-18">B</text>
    <circle cx="405" cy="401" r="21" fill="#ff8c75"/>
    <circle cx="405" cy="401" r="36" fill="none" stroke="#ff8c75" stroke-opacity=".18" stroke-width="13"/>
    <rect x="36" y="36" width="440" height="440" rx="116" fill="none" stroke="#d8f36b" stroke-opacity=".22" stroke-width="4"/>
  </g>
</svg>
