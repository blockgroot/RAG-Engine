# Render Blueprint for the STAGING backend -- deploys the `staging` branch.
#
# Separate from `render.yaml` on purpose: that file is the from-scratch recipe
# for prod (see its header), and prod (Hand-Book) is managed in the dashboard.
# This one creates ONE new service, `handbook-staging`, that tracks `staging`.
#
# HOW TO USE
#   1. Render -> New -> Blueprint -> this repo, branch `staging`, and set the
#      Blueprint file path to `render.staging.yaml`.
#   2. A Blueprint can only manage services it CREATES. If you already made a
#      staging service by hand, delete it first (or it will simply sit beside
#      this one, unused).
#   3. Render asks for every `sync: false` value once, on the first sync. Those
#      are the only values you type; everything else is filled in below.
#
# VALUES THAT MUST DIFFER FROM PROD (copying prod's would let staging touch
# prod, or break staging):
#   DATABASE_URL          -- the staging Supabase project (Session pooler, 5432)
#   AUTH_JWT_SECRET       -- generated below, so a prod cookie never works here
#   AUTH_ENCRYPTION_KEYS  -- staging's own key (tokens are encrypted with it)
#   INTERNAL_TICK_SECRET  -- generated below
#   FRONTEND_URL / API_CORS_ORIGINS / every *_REDIRECT_URI -- the staging
#                            frontend's address, never prod's
#   CLOUDINARY_FOLDER     -- a staging folder, set below, so the two
#                            environments never see each other's files
#   Slack / GitHub apps   -- one app delivers to ONE address; use separate
#                            staging apps or leave those keys empty
#
# Same DO-NOT-ADD rules as render.yaml: no top-level `region:`, no `previews:`.
# `region:` on the service is fine here ONLY because this creates a new service.

services:
  - type: web
    name: handbook-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: staging
    autoDeploy: true
    plan: free
    region: singapore        # next to the ap-south-1 (Mumbai) database
    healthCheckPath: /health
    envVars:
      # ================================================================
      # Database -- the new staging Supabase project.
      # Session pooler string, port 5432 (NOT 6543, which breaks the
      # once-per-connection pgvector setup):
      # postgresql://postgres.<project-ref>:<password>@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
      # The schema is applied on every boot, so an empty database is fine.
      # ================================================================
      - key: DATABASE_URL
        sync: false
      - key: VECTOR_STORE_BACKEND
        value: pgvector
      - key: DB_POOL_MIN_SIZE
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "10"

      # ================================================================
      # Auth / security
      # ================================================================
      - key: AUTH_JWT_SECRET
        generateValue: true
      # A Fernet key. Render's generated values are not Fernet-shaped, so make
      # one and paste it:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: AUTH_ENCRYPTION_KEYS
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Real client IP for the rate limiter when the frontend is on Vercel.
      - key: CLIENT_IP_HEADER
        value: x-vercel-forwarded-for

      # ================================================================
      # Frontend / CORS -- the STAGING frontend origin, e.g.
      # https://handbook-staging.vercel.app (no trailing slash).
      # OAuth callbacks live on the frontend origin too (see *_REDIRECT_URI).
      # ================================================================
      - key: FRONTEND_URL
        sync: false
      - key: API_CORS_ORIGINS
        sync: false

      # ================================================================
      # LLM (answers). Same provider as prod is fine; a separate key keeps
      # staging traffic out of prod's 15 rpm budget.
      # ================================================================
      - key: LLM_MODEL
        value: gemini-3.5-flash      # change to prod's model if it differs
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TIMEOUT
        value: "45"
      # Background (ingest) endpoint. Leave BOTH empty to share the main key;
      # set BOTH to give background work its own quota.
      - key: LLM_AUX_BASE_URL
        sync: false
      - key: LLM_AUX_API_KEY
        sync: false
      - key: LLM_MAX_RPM
        value: "15"
      - key: LLM_RESERVE_RPM
        value: "5"

      # -- Model picker (optional; an empty key simply hides those models) --
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_TIMEOUT
        value: "45"
      - key: OPENROUTER_TITLE
        value: Handbook (staging)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_TIMEOUT
        value: "60"

      # ================================================================
      # Embeddings + reranker (remote -- the local models do not fit the
      # free instance). Staging has its own database, so it does not have
      # to match prod's model, but EMBEDDING_DIM must stay 1024.
      # ================================================================
      - key: EMBEDDING_BACKEND
        value: remote
      - key: EMBEDDING_MODEL
        value: jina-embeddings-v3
      - key: EMBEDDING_BASE_URL
        value: https://api.jina.ai/v1
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_DIM
        value: "1024"
      - key: EMBEDDING_TIMEOUT
        value: "20"
      - key: EMBED_BATCH_SIZE
        value: "16"
      - key: RERANKER_BACKEND
        value: remote
      - key: RERANKER_MODEL
        value: jina-reranker-v3
      - key: RERANKER_BASE_URL
        value: https://api.jina.ai/v1
      # The same Jina key as EMBEDDING_API_KEY is fine.
      - key: RERANKER_API_KEY
        sync: false
      - key: RETRIEVAL_RERANK_ENABLED
        value: "true"

      # ================================================================
      # Email (magic-link login). Render free blocks SMTP, so SendGrid.
      # EMAIL_SMTP_FROM must be a SendGrid-verified single sender, e.g.
      # "Handbook Staging <you@yourdomain.com>".
      # ================================================================
      - key: EMAIL_SENDER
        value: sendgrid
      - key: EMAIL_SENDGRID_API_KEY
        sync: false
      - key: EMAIL_SMTP_FROM
        sync: false
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false

      # ================================================================
      # File attachments -- same Cloudinary account is fine, but a SEPARATE
      # folder, or the orphan report would list prod's files as staging's.
      # ================================================================
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: handbook-staging/attachments

      # ================================================================
      # Connectors. Every redirect URI is on the STAGING FRONTEND origin:
      #   <FRONTEND_URL>/api/auth/<provider>/callback
      # and must also be added to that provider's app settings. Leave a
      # provider's keys empty to hide it on staging.
      # ================================================================
      # -- Notion --
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI
        sync: false
      # -- Google Drive --
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_FORMS_ENABLED
        value: "false"
      - key: GOOGLE_GROUPS_ENABLED
        value: "false"
      # -- Slack (a Slack app sends events to ONE URL: use a staging app) --
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      # -- Linear --
      - key: LINEAR_CLIENT_ID
        sync: false
      - key: LINEAR_CLIENT_SECRET
        sync: false
      - key: LINEAR_REDIRECT_URI
        sync: false
      # -- GitHub App (ONE callback URL per app: use a staging GitHub App) --
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false

      # ================================================================
      # Second Brain. The graph builds either way; this flag decides
      # whether answers use it. Staging is the place to try it -- set it to
      # "true" here when you want to test, before it goes near prod.
      # ================================================================
      - key: GRAPH_RETRIEVAL_ENABLED
        value: "false"
      - key: GRAPH_META_REFRESH_BATCH
        value: "25"

      # ================================================================
      # Automatic sync. The free instance sleeps after ~15 min with no
      # request; prod is woken by .github/workflows/tick.yml, which only
      # calls prod. For staging, point a free cron (e.g. cron-job.org) at
      # POST https://<this-service>.onrender.com/internal/tick with header
      # `X-Tick-Secret: <INTERNAL_TICK_SECRET>` every 10 minutes, or accept
      # that staging only syncs while someone is using it.
      # ================================================================
      - key: AUTO_SYNC_ENABLED
        value: "true"
      - key: AUTO_SYNC_INTERVAL_HOURS
        value: "1"
      - key: AUTO_SYNC_BATCH_SIZE
        value: "5"
      - key: INTERNAL_TICK_SECRET
        generateValue: true
      - key: SCHEDULER_ENABLED
        value: "true"

      # ================================================================
      # Runtime tuning -- identical to prod's recipe (512MB free instance).
      # ================================================================
      - key: MODEL_WARMUP_ON_STARTUP
        value: "true"
      - key: INGEST_WORKER_IN_API
        value: "true"
      - key: INGEST_CONTEXTUAL_MAX_CHUNKS
        value: "200"
      - key: INGEST_MEMORY_GUARD_ENABLED
        value: "true"
      - key: INGEST_MAX_RSS_MB
        value: "400"
      - key: INGEST_MAX_JOB_ATTEMPTS
        value: "3"
      - key: QUERY_NORM_CACHE_MAX_ORGS
        value: "50"
      - key: CHUNK_TOKEN_BACKEND
        value: heuristic
      - key: CHUNK_MAX_CHARS
        value: "4000"
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.35"
